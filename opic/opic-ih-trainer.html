<style>
/* Layout: one-column study app, sticky header with section tabs, content cards stacked; exam-booth feel (teal ink + amber level marks) */
:root{

  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1515; --surface:#162020; --sunk:#1D2928; --ink:#E4ECEB; --muted:#94A6A3; --line:#2A3837;
  --accent:#3DB5AE; --accent-ink:#06201E; --accent-soft:#16332F; --amber:#F0B45A; --amber-soft:#3A2C14;
  --good:#5CC47D; --warn:#F0B45A; --bad:#F2867E; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1515; --surface:#162020; --sunk:#1D2928; --ink:#E4ECEB; --muted:#94A6A3; --line:#2A3837;
  --accent:#3DB5AE; --accent-ink:#06201E; --accent-soft:#16332F; --amber:#F0B45A; --amber-soft:#3A2C14;
  --good:#5CC47D; --warn:#F0B45A; --bad:#F2867E; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:12px 6px}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand h1 b{color:var(--accent)}
.brand .lvl{font-family:var(--f-mono);font-size:12px;color:var(--amber);background:var(--amber-soft);padding:2px 8px;border-radius:99px;white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font:500 14px var(--f-body);padding:7px 12px;border-radius:99px;cursor:pointer}
nav.tabs button[aria-current="true"]{background:var(--ink);color:var(--bg)}
main{padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
h2{font-size:19px;margin:6px 0 0;text-wrap:balance}
h3{font-size:16px;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.chipbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--f-body);padding:6px 11px;border-radius:99px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font:700 14px var(--f-body);padding:10px 16px;border-radius:8px;cursor:pointer}
.btn.ghost{background:var(--sunk);color:var(--ink);font-weight:500}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em;padding:2px 8px;border-radius:5px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.plain{background:var(--sunk);color:var(--muted)}
button:focus-visible,textarea:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.en{font-size:15.5px;line-height:1.55}
.ko{font-size:13.5px;color:var(--muted)}
ol.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
ol.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;counter-increment:s}
ol.steps li::before{content:counter(s);font:600 12px var(--f-mono);color:var(--accent);background:var(--accent-soft);border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
ol.steps li > div{min-width:0}
.pat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding-block:9px;border-top:1px solid var(--line)}
.pat:first-of-type{border-top:0}
.pat .ko{grid-column:1}
.say{border:1px solid var(--line);background:transparent;color:var(--accent);font:600 12px var(--f-mono);border-radius:6px;padding:3px 8px;cursor:pointer;align-self:start}
details{border-top:1px solid var(--line);padding-top:8px}
details:first-of-type{border-top:0;padding-top:0}
summary{cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-family:var(--f-mono)}
details[open] > summary::after{content:"−"}
.q{padding-block:10px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.q:first-child{border-top:0}
.answer{background:var(--sunk);border-radius:8px;padding:12px;font-size:14.5px;line-height:1.65;white-space:pre-wrap}
mark{background:var(--amber-soft);color:inherit;border-radius:3px;padding:0 2px}
textarea{width:100%;min-height:180px;resize:vertical;font:15px/1.6 var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
select{font:14px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
.qbox{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.qbox .en{font-size:17px;font-weight:500}
.qbox .chip{background:color-mix(in srgb,var(--bg) 16%,transparent);color:inherit}
.timer{font:600 28px var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer.t1{color:var(--good)} .timer.t2{color:var(--warn)} .timer.t3{color:var(--bad)}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.mk{font:700 13px var(--f-mono);width:20px;height:20px;border-radius:5px;display:grid;place-items:center}
.mk.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.mk.mid{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.mk.no{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.est{display:flex;align-items:center;gap:14px}
.est .big{font:700 30px var(--f-mono);color:var(--amber)}
.flash{min-height:170px;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.flash .ko{font-size:17px;color:var(--ink);font-weight:500}
.flash .en{font-size:18px;color:var(--accent);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font:700 22px var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.note{border-left:3px solid var(--amber);padding:8px 12px;background:var(--amber-soft);border-radius:0 8px 8px 0;font-size:13.5px}
a{color:var(--accent)}
.vid{display:grid;grid-template-columns:28px 1fr;gap:10px;padding-block:10px;border-top:1px solid var(--line)}
.vid:first-child{border-top:0}
.vid .n{font:600 13px var(--f-mono);color:var(--muted)}
.ai{white-space:pre-wrap}
.ai h4{margin:8px 0 4px;font-size:14px}
.fix{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:3px}
.strike{text-decoration:line-through;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
</style>

const SAMPLES = {
intro:"Hi, my name is Minji, and I'm 27 years old. I live in Seoul with my family. Well, I work as an office worker at a marketing company, so I'm pretty busy during the week. But on weekends, I try to relax as much as possible. You know, I really love listening to music and going for a walk in a park near my place. It really helps me relieve stress. Oh, and I'm kind of a homebody, so I like watching movies at home too. These days, I'm preparing for the OPIc test because I want to improve my English for my career. So yeah, that's pretty much about me. Thanks for listening!",
home_desc:"Oh, you wanna know about my home? Sure. I live in an apartment in Seoul with my family. It's on the 12th floor, so the view is pretty nice, especially at night. When it comes to my home, the first thing that comes to my mind is the living room. It's kind of big and has a huge sofa and a TV, so my family usually hangs out there after dinner. There are three bedrooms, two bathrooms, and a small kitchen. My room is not that big, but it's really cozy. I have a bed, a desk, and a bookshelf, and I decorated it with some plants. What I like most about my home is that it's really quiet, so I can rest whenever I want. Honestly, it's my favorite place in the world. So yeah, that's pretty much it.",
home_cmp:"Compared to the past, homes in Korea have changed a lot. Back in the day, a lot of people lived in houses with a yard. When I was a kid, I used to live in a small house in my hometown, and there was a little garden where my grandma grew vegetables. But these days, most people live in apartments, especially in big cities like Seoul. One of the biggest changes is that homes have become much more convenient. For example, now we have smart home systems, so we can turn on the lights or the air conditioner with our phones. I think it's because technology has developed so fast. Personally, I like living in an apartment because it's convenient and safe. But sometimes, I miss my old house and the garden. So yeah, that's how homes have changed in my country.",
music_routine:"Well, I listen to music pretty much every day. It's like a part of my daily routine. First of all, I usually listen to music on my way to work. I put on my earphones as soon as I get on the subway, and I listen to K-pop or some chill pop songs. It really helps me wake up in the morning. After that, when I'm working, I sometimes listen to music without lyrics, like lo-fi or jazz, because it helps me focus. And then, after I get home, I play some music on my speaker while I'm cooking or cleaning. Oh, and before I go to bed, I listen to calm ballads to relax. I think that's why I love music so much. It's always with me, you know. Anyway, that's all I can say about my music routine.",
movie_exp:"Let me tell you about a movie I'll never forget. It was about two years ago, and I went to see Parasite with my best friend. Actually, I didn't know much about the movie before I watched it, so I had no idea what to expect. At first, it seemed like a funny family story. But all of a sudden, the story became really dark and intense. I was like, wow, what is going on? I couldn't take my eyes off the screen. After the movie, my friend and I went to a café and talked about it for hours. We had totally different opinions about the ending, so it was really interesting. Looking back, it was such a great experience because it made me think a lot about society. Since then, I've been a huge fan of director Bong Joon-ho. So yeah, that's my most memorable movie.",
walk_desc:"There's a park near my apartment, and I go there to take a walk almost every evening. It's located right next to the Han River, so it's really easy to get to. It's about a 5-minute walk from my place. The park is pretty big, and there's a long walking trail along the river. There are tons of trees and flowers, and there are also some benches where people can sit and relax. In the evening, a lot of people come out to walk their dogs, jog, or ride bikes. What I like most about this park is the view at night. The bridges are lit up, and it has a really chill vibe. Whenever I walk there, I feel so refreshed. It's totally worth it. That's why this park is really special to me.",
otravel_exp:"Let me tell you about something unexpected that happened during my trip to Japan. It was about three years ago, and I went to Osaka with my sister. On the second day, we were supposed to take a train to Kyoto. But all of a sudden, I realized that I had lost my wallet. I had no idea what to do because my passport and credit card were in it. I was totally freaking out. So, we went back to the restaurant where we had lunch. Luckily, the staff had found my wallet and kept it for me. Everything was still in it! I was so relieved, and I thanked them like a hundred times. It turned out that this kind of thing happens a lot in Japan because people are really honest. Looking back, it was a scary moment, but now it's a funny story. Since then, I always keep my wallet in my front pocket.",
bank_desc:"Well, there's a bank right in front of my office, so I go there quite often. It's on the first floor of a big building, so it's really easy to find. When you walk in, the first thing you see is a ticket machine. You take a number and wait for your turn. There are some sofas in the waiting area, and there's also a water purifier and some magazines. On one side, there are about five counters where the tellers work. And on the other side, there are a few ATMs, so you can withdraw or deposit money quickly. The bank is very clean and quiet, and the staff are really friendly. But honestly, these days I don't go there that often because I usually use mobile banking. Anyway, that's what the bank near my office looks like.",
rest_exp:"Let me tell you about a time when I had a bad experience at a restaurant. It was last year, on my mom's birthday. I booked a table at a fancy Italian restaurant a week in advance. But when we got there, the staff said there was no reservation under my name. I was like, what? I showed them the confirmation text, and it turned out that they made a mistake. Unfortunately, the restaurant was full, so we had to wait for about 30 minutes. I was really upset because it was a special day. But the manager came out and apologized, and he gave us a free dessert and a bottle of wine. The food was really delicious, so in the end, my mom was happy. Looking back, it was kind of a stressful day, but they handled it really well. Since then, I always call the restaurant to double-check my reservation.",
salon_routine:"I usually go to the hair salon once every two months. Before I go, I always make a reservation through an app, because the salon I go to is pretty popular. When I get there, the staff greets me and offers me a drink, like coffee or tea. Then, I sit down and talk with my hairdresser about what style I want. I usually show some pictures on my phone to explain it. After that, they wash my hair and start cutting. It takes about an hour. While I'm waiting, I usually read a magazine or just chat with the hairdresser. Finally, they blow-dry my hair and style it. I always feel so refreshed after a haircut. It's like a small reward for myself. So yeah, that's what I usually do at the hair salon.",
hosp_exp:"Let me tell you about the time I went to the emergency room. It was about a year ago, around midnight. All of a sudden, I got a terrible stomachache. At first, I thought it was just indigestion, so I took some medicine. But it got worse and worse, and I couldn't even stand up. I had no idea what to do, so my brother drove me to the hospital. When we got there, the doctor checked me and said I might have appendicitis. I was so scared. Luckily, it turned out that it was just a bad case of food poisoning. I got a shot and stayed there for a few hours. Looking back, it was a really scary night, but I was so thankful for my brother and the medical staff. Since then, I've been really careful about what I eat.",
pharm_desc:"Oh, you wanna know about the pharmacy in my neighborhood? Sure. There's a small pharmacy right next to the bus stop near my apartment, so it's really easy to get to. When you walk in, the first thing you see is a long counter where the pharmacist works. Behind the counter, there are tons of shelves full of medicine. In front of the counter, there are some products you can just pick up, like vitamins, band-aids, masks, and some skin care products. The pharmacist is really kind and always explains how to take the medicine. For example, last month I had a bad cold, and he told me to take the pills after meals and drink lots of water. What I like most about this pharmacy is that it's open until 10 p.m., so I can go there after work. That's why it's really special to me. So yeah, that's pretty much it.",
rp11_concert:"Hi, I'm calling to ask about the concert this Saturday. I'm thinking of buying some tickets, so I have a few questions. First, I was wondering if there are still tickets available for the Saturday show. If so, could you tell me how much they are? Also, are there different seats, like VIP seats or standing seats? I want to sit close to the stage if possible. And do you happen to know what time the doors open? I want to get there early to buy some merchandise. Oh, one more thing. Is there a parking lot near the concert hall? Lastly, is it possible to get a refund if I can't make it? Okay, I think that's all. Thank you so much for your help. Have a nice day!",
rp12_sick:"Hey Jisoo, it's me. I'm afraid I have some bad news. I'm really sorry, but I can't go to the concert with you tonight. Here's the thing. I woke up this morning with a high fever, and the doctor told me to stay home and rest. I know you were really looking forward to it, so I feel terrible. So, I was wondering if we could do something else instead. Option one: you can go with another friend. I'll give you my ticket, so you don't have to pay for it. Or, option two: we can sell the tickets online and go to another concert together next month. I'll check the schedule. If that doesn't work, how about I treat you to a nice dinner when I get better? Please let me know which works best for you. Again, I'm really sorry for the trouble.",
rp13_cancel:"Actually, I had a similar experience a few years ago. I was planning to go on a trip to Jeju Island with my friends. We booked the flight and the hotel about a month in advance. But two days before the trip, there was a big typhoon, and all the flights were canceled. I was so disappointed because we had been looking forward to the trip for so long. At first, I had no idea what to do. So, I called the airline and the hotel. Luckily, the airline gave us a full refund, and the hotel let us change our dates for free. In the end, we went to Jeju a month later, and the weather was perfect. Looking back, it turned out to be a good thing. Since then, I always check the weather forecast before I travel."

function speak(text){
  try{
    if(!("speechSynthesis" in window)) return toast("이 브라우저는 읽어주기를 지원하지 않아요");
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text.replace(/___/g,"blank"));
    u.lang="en-US"; u.rate=.95;
    const v=speechSynthesis.getVoices().find(v=>/en-US/i.test(v.lang));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){toast("읽어주기를 시작하지 못했어요")}
}
function toast(msg){
  let t=document.getElementById("toast");
  if(!t){t=document.createElement("div");t.id="toast";t.setAttribute("role","status");
    t.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13.5px;z-index:20;max-width:90vw";
    document.body.appendChild(t)}
  t.textContent=msg;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2200);
}
function fmt(sec){const m=Math.floor(sec/60),s=Math.floor(sec%60);return m+":"+String(s).padStart(2,"0")}
function highlightPatterns(text){
  let h=esc(text);
  PATTERNS.forEach(p=>{const k=esc(p.k).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");h=h.replace(new RegExp("("+k+")","ig"),"<mark>$1</mark>")});
  return h;
}

/* ============================== ANALYSIS ============================== */
function analyze(text,type){
  const raw=text.trim(); const low=" "+raw.toLowerCase().replace(/[’]/g,"'")+" ";
  const words=(raw.match(/[A-Za-z][A-Za-z'’-]*/g)||[]);
  const wc=words.length;
  const sents=raw.split(/[.!?]+\s*/).filter(s=>s.trim().split(/\s+/).length>2);
  const avg=sents.length?wc/sents.length:0;
  const conn=CONNECTORS.filter(c=>new RegExp("\\b"+c.replace(/ /g,"\\s+")+"\\b","i").test(low));
  const pats=PATTERNS.filter(p=>low.includes(p.k));
  const fill=FILLERS.filter(f=>low.includes(f));
  const wl=words.map(w=>w.toLowerCase());
  const past=wl.filter(w=>(/ed$/.test(w)&&w.length>3&&!["need","feed","speed","seed","bed","red","indeed"].includes(w))||PAST_IRREG.includes(w)).length;
  const qmarks=(raw.match(/\?/g)||[]).length;
  const korean=/[가-힣]/.test(raw);
  const opener=/^(oh|well|okay|sure|hi|hey|let me|to be honest|honestly|so|actually|compared|when it comes|there's|i usually)/i.test(raw);
  const closer=/(pretty much it|that's all|that's why|special to me|thanks for listening|thank you|have a nice day|sorry for the trouble|that's my|never forget|that's how|that's what)/i.test(raw.slice(-160));
  const checks=[]; let pts=0, max=0;
  const add=(ok,mid,label,tip,w=2)=>{max+=w;const st=ok?"ok":mid?"mid":"no";pts+=ok?w:mid?w/2:0;checks.push({st,label,tip})};
  const target = type==="intro"?70:(type==="rp11"?90:120);
  add(wc>=target,wc>=target*0.65,`분량 ${wc}단어 (목표 ${target}+)`,"IH는 1분 30초~2분 동안 끊기지 않고 말해요. 디테일을 한두 문장 더 붙이세요.",3);
  add(conn.length>=5,conn.length>=3,`연결어 ${conn.length}개`,"First / After that / But / So / Because 같은 연결어로 문장을 이어야 '문단'으로 들려요. IH의 핵심이에요.");
  add(pats.length>=4,pats.length>=2,`만능패턴 ${pats.length}개 사용`,"외운 패턴을 3~5개 섞으면 문장이 자연스럽고 막힘이 줄어요.");
  add(opener,false,"자연스러운 시작","Oh, / Well, / Let me tell you about ~ 처럼 바로 받아주며 시작하세요.",1);
  add(closer,false,"마무리 문장","So yeah, that's pretty much it. 같은 마무리로 끝났다는 신호를 주세요.",1);
  if(type==="exp"||type==="rp13"){
    add(past>=8,past>=4,`과거시제 ${past}개`,"경험 문제는 과거시제가 가장 중요해요. was / went / had / -ed 를 의식해서 쓰세요.",3);
    add(/all of a sudden|suddenly|but then|unfortunately|turned out/i.test(raw),false,"사건 전개(갑자기·알고보니)","All of a sudden / It turned out that 으로 이야기에 굴곡을 만드세요.");
  }
  if(["desc","routine","exp","compare"].includes(type)) add(/(for example|for instance|like when)/i.test(raw)&&/(because|that's why|since|so that)/i.test(raw),/(for example|for instance|because|that's why)/i.test(raw),"구체적 예시 + 이유","IH 답변은 상황 설명 뒤에 예시(For example, ~)와 이유(because ~)가 이어져요. 둘 다 한 번씩 넣어보세요.");
  if(type==="routine") add(/(first|after that|and then|finally|before i)/i.test(raw)&&conn.length>=4,/(first|then)/i.test(raw),"순서 표현","First → After that → And then → Finally 로 시간 순서를 보여주세요.");
  if(type==="compare") add(/(back in the day|used to|in the past|when i was)/i.test(raw)&&/(these days|nowadays|now)/i.test(raw),/(past|now|these days)/i.test(raw),"과거 vs 현재 대비","Back in the day ~ / But these days ~ 로 대비를 분명히 하세요.");
  if(type==="desc") add(/(located|there (is|are)|there's)/i.test(raw)&&/(what i like most|i love|i like)/i.test(raw),/(there (is|are)|there's|located)/i.test(raw),"묘사 디테일 + 내 생각","위치·구성(There are ~) + 좋아하는 이유(What I like most ~)를 모두 넣으세요.");
  if(type==="rp11") add(qmarks>=3,qmarks>=2,`질문 ${qmarks}개`,"롤플 11번은 질문 3~4개가 기준이에요. I was wondering if / Could you tell me 로 다양하게.",3);
  if(type==="rp12") add(/(instead|option|how about|what if|could we)/i.test(raw)&&/(sorry|afraid)/i.test(raw),/(sorry|instead|how about)/i.test(raw),"사과 + 대안 2개 이상","I'm really sorry → Option one / Option two / How about ~ 순서로.",3);
  add(avg>=8&&avg<=22,avg>=6,`문장 길이 평균 ${avg.toFixed(1)}단어`,"너무 짧은 단문만 쓰면 IM으로 들려요. because, so, when 으로 문장을 이어 붙이세요.",1);
  if(korean) checks.push({st:"no",label:"한국어가 섞여 있어요",tip:"모르는 단어는 쉬운 영어로 돌려 말하기 연습을 하세요. (예: 'the thing you use to ~')"});
  const ratio=pts/max;
  const level = ratio>=.85?"IH":ratio>=.68?"IM3":ratio>=.5?"IM2":"IM1";
  return {wc,conn,pats,fill,past,qmarks,checks,level,ratio};
}

const TABS=[["learn","학습"],["cards","패턴카드"],["practice","답변연습"],["mock","모의고사"],["record","기록"]];
function renderTabs(){
  document.getElementById("tabs").innerHTML=TABS.map(([k,n])=>`<button data-tab="${k}" aria-current="${S.tab===k}">${n}</button>`).join("");
  const n=S.hist.length; document.getElementById("streak").textContent=n?`연습 ${n}회`:"IM → IH";
}
function render(){
  renderTabs();
  stopTimer();
  const v={learn:vLearn,cards:vCards,practice:vPractice,mock:vMock,record:vRecord}[S.tab];
  app.innerHTML=v();
  if(S.tab==="practice"&&S.pQ) bindAnswerBox("p");
  if(S.tab==="mock"&&S.mock&&!S.mock.done) bindAnswerBox("m");
  window.scrollTo({top:0});
}

Return ONLY JSON, all explanations in Korean (English sentences stay in English):

function buildMock(){
  const sel=TOPICS.filter(t=>t.g==="선택"), dol=TOPICS.filter(t=>t.g==="돌발");

  const [a,b]=shuffle(sel), c=pick(dol);
  const set=tp=>["desc","routine","exp"].map(t=>{const q=tp.qs.find(x=>x.t===t);return {...q,topic:tp.id,tname:tp.name,g:tp.g}});
  const rpTopic=pick([...new Set(RP.map(r=>r.topic))].filter(t=>RP.some(r=>r.topic===t&&r.t==="rp11")&&RP.some(r=>r.topic===t&&r.t==="rp12")));
  const rp=t=>{const r=RP.find(x=>x.topic===rpTopic&&x.t===t)||pick(RP.filter(x=>x.t===t));const tp=TOPICS.find(x=>x.id===r.topic);return {...r,tname:tp?tp.name:""}};
  const cmpPool=QALL.filter(q=>q.t==="compare");

document.addEventListener("click",e=>{

    if(d.mplay){const M=S.mock;if((M.plays||0)>=2) return toast("문제는 두 번까지만 들을 수 있어요");M.plays=(M.plays||0)+1;b.textContent=`문제 듣기 (${2-M.plays}회 남음)`}

    const r=document.getElementById("presult"); r.innerHTML=resultHTML(a,S.pQ,text,"p"); r.scrollIntoView({behavior:"smooth",block:"start"});return}
  if(d.showsample){const q=S.pQ;const r=document.getElementById("presult");const s=SAMPLES[q.s];
    const div=document.createElement("div");div.className="card";div.innerHTML=`<h3>IH 모범답변</h3><div class="answer">${highlightPatterns(s)}</div><div class="row"><button class="say" data-say="${esc(s)}">답변 듣기 (쉐도잉)</button></div>`;
    r.appendChild(div);div.scrollIntoView({behavior:"smooth",block:"start"});b.disabled=true;return}
  if(d.retry){document.getElementById("presult").innerHTML="";const ta=document.getElementById("pans");ta.focus();ta.scrollIntoView({block:"center"});startTimer("p");return}
  if(d.ai){b.disabled=true;aiReview(S.pQ,document.getElementById("pans").value.trim(),document.getElementById("pai"));return}
  if(d.mstart){S.mock={qs:buildMock(),i:0,res:[],plays:0,done:false};S.tab="mock";render();return}
  if(d.mnext){const M=S.mock;const text=document.getElementById("mans").value.trim();const q=M.qs[M.i];
    const a=analyze(text||"",q.t);const sec=Math.round(timer.elapsed||0);M.res.push({q,text,a,sec});
    if(text) {timer.elapsed=sec;saveHist(q,text,a,"mock")}
    M.i++;M.plays=0;if(M.i>=15)M.done=true;render();return}
  if(d.card){const list=cardList();const p=list[S.cardIdx];
    if(d.card==="know"){S.known[p.en]=true;LS.set("known",S.known)}
    if(d.card==="again"){S.known[p.en]=false;LS.set("known",S.known)}
    S.cardIdx=d.card==="prev"?(S.cardIdx-1+list.length)%list.length:(S.cardIdx+1)%list.length;S.cardFlip=false;render();return}
  if(d.cc){S.cardCat=d.cc;S.cardIdx=0;S.cardFlip=false;render();return}
  if(d.flip){S.cardFlip=!S.cardFlip;render();return}
  if(d.clear){const c=document.getElementById("clearconfirm");c.innerHTML=`<span class="small">정말 지울까요?</span> <button class="btn" data-clearyes="1">지우기</button>`;return}
  if(d.clearyes){S.hist=[];LS.set("hist",[]);render();toast("기록을 지웠어요");return}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.flip){e.preventDefault();S.cardFlip=!S.cardFlip;render()}});
document.addEventListener("change",e=>{
  if(e.target.id==="ptype"){S.pType=e.target.value}
  if(e.target.id==="pgroup"){S.pGroup=e.target.value}
});
try{speechSynthesis.getVoices()}catch(e){}
render();
</script>
